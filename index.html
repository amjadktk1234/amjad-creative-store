<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Creative Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 10px 0 0;
      color: #cbd5e1;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 30px 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 22px;
    }

    .card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
    }

    .content {
      padding: 18px;
    }

    .content h2 {
      margin: 0 0 8px;
    }

    .category {
      color: #6366f1;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .description {
      color: #666;
      line-height: 1.5;
    }

    .price {
      font-size: 21px;
      font-weight: bold;
      margin: 15px 0;
    }

    .buy {
      display: block;
      background: #16a34a;
      color: white;
      text-decoration: none;
      text-align: center;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    .message {
      text-align: center;
      padding: 50px 15px;
    }
  </style>
</head>

<body>

<header>
  <h1>Digital Creative Store</h1>
  <p>Premium Digital Designs</p>
</header>

<main class="container">
  <div id="products" class="products">
    <div class="message">Loading products...</div>
  </div>
</main>

<script>
  const SUPABASE_URL =
    "https://mchewsmjbkexojdaruhj.supabase.co";

  /* =========================================
     IMPORTANT:
     Paste your real Supabase Publishable/Anon
     key between the quotation marks below.
     ========================================= */

  const SUPABASE_ANON_KEY =
    https://mchewsmjbkexojdaruhj.supabase.co

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  async function loadProducts() {

    const container = document.getElementById("products");

    const { data, error } = await supabaseClient
      .from("Product")
      .select("*");

    if (error) {
      console.error("Supabase error:", error);

      container.innerHTML = `
        <div class="message">
          <h2>Unable to load products</h2>
          <p>${error.message}</p>
        </div>
      `;

      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = `
        <div class="message">
          <h2>No products yet</h2>
          <p>Please add a product in Supabase.</p>
        </div>
      `;

      return;
    }

    container.innerHTML = "";

    data.forEach(product => {

      const imageUrl =
        product.image_url ||
        "https://via.placeholder.com/600x400?text=Product";

      let whatsappButton = "";

      if (product.whatsapp) {

        const number =
          product.whatsapp.replace(/\D/g, "");

        const message =
          "Hello, I want to buy " +
          (product.name || "this product");

        whatsappButton = `
          <a
            class="buy"
            href="https://wa.me/${number}?text=${encodeURIComponent(message)}"
            target="_blank">
            Buy on WhatsApp
          </a>
        `;

      } else {

        whatsappButton = `
          <a
            class="buy"
            href="#"
            onclick="return false;">
            WhatsApp Coming Soon
          </a>
        `;
      }

      container.innerHTML += `
        <div class="card">

          <img
            src="${imageUrl}"
            alt="${product.name || "Product"}">

          <div class="content">

            <h2>
              ${product.name || "Unnamed Product"}
            </h2>

            <div class="category">
              ${product.category || ""}
            </div>

            <div class="description">
              ${product.description || ""}
            </div>

            <div class="price">
              Rs. ${product.price || "0"}
            </div>

            ${whatsappButton}

          </div>

        </div>
      `;
    });
  }

  loadProducts();
</script>

</body>
</html>
