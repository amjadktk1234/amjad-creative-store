<!DOCTYPE html>
<html>
<head>
  <title>Supabase Test</title>
</head>

<body>

<h1>Supabase Product Test</h1>

<div id="result">Testing...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
"https://mchewsmjbkexojdaruhj.supabase.co";

const SUPABASE_ANON_KEY =
sb_publishable_py_FXTwY_RjIuADMGvSDmw_1BjzedKu

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

async function test() {

  const result = document.getElementById("result");

  const { data, error } =
    await db.from("Product").select("*");

  if (error) {
    result.innerHTML =
      "<h2>ERROR</h2><pre>" +
      JSON.stringify(error, null, 2) +
      "</pre>";
    return;
  }

  result.innerHTML =
    "<h2>SUCCESS</h2><pre>" +
    JSON.stringify(data, null, 2) +
    "</pre>";
}

test();
</script>

</body>
</html>
