if (error) {
  console.error("Supabase error:", error);

  container.innerHTML = `
    <div class="message">
      <h2>Supabase Error</h2>
      <p>${error.message}</p>
      <p><strong>Code:</strong> ${error.code || "N/A"}</p>
      <p><strong>Details:</strong> ${error.details || "N/A"}</p>
      <p><strong>Hint:</strong> ${error.hint || "N/A"}</p>
    </div>
  `;

  return;
}
