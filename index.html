<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Creative Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .card-content {
      padding: 16px;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .category {
      color: #6366f1;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      font-size: 14px;
      line-height: 1.5;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 12px 0;
    }

    .buy {
      display: block;
      text-align: center;
      background: #16a34a;
      color: white;
      text-decoration: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    .loading,
    .error {
      text-align: center;
      padding: 40px;
    }
  </style>
</head>

<body>

<header>
  <h1>Digital Creative Store</h1>
  <p>Premium Digital Designs</p>
</header>

<div class="container">
  <div id="products" class="products">
    <div class="loading">Loading products...</div>
  </div>
</div>

<script>
  const SUPABASE_URL =
    "https://mchewsmjbkexojdaruhj.supabase.co";

  const SUPABASE_ANON_KEY =
    "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  async function loadProducts() {

    const container = document.getElementById("products");

    const { data, error } = await supabaseClient
      .from("Product")
      .select("*")
      .order("id", { ascending: false });

    if (error) {
      console.error(error);

      container.innerHTML = `
        <div class="error">
          <h2>Products could not be loaded</h2>
          <p>${error.message}</p>
        </div>
      `;

      return;
    }

    if (!data || data.length === 0) {
      container.innerHTML = `
        <div class="loading">
          <h2>No products yet</h2>
          <p>Add a product from Supabase Table Editor.</p>
        </div>
      `;

      return;
    }

    container.innerHTML = "";

    data.forEach(product => {

      const image = product.image_url
        ? product.image_url
        : "https://via.placeholder.com/600x400?text=No+Image";

      const whatsappNumber = product.whatsapp || "";

      const message =
        "Hello, I want to buy: " +
        (product.name || "Product");

      const whatsappLink = whatsappNumber
        ? "https://wa.me/" +
          whatsappNumber.replace(/\D/g, "") +
          "?text=" +
          encodeURIComponent(message)
        : "#";

      container.innerHTML += `
        <div class="card">

          <img
            src="${image}"
            alt="${product.name || "Product"}"
          >

          <div class="card-content">

            <h2>
              ${product.name || "Unnamed Product"}
            </h2>

            <div class="category">
              ${product.category || ""}
            </div>

            <div class="description">
              ${product.description || ""}
            </div>

            <div class="price">
              Rs. ${product.price || "0"}
            </div>

            ${
              whatsappNumber
              ? `<a class="buy"
                   href="${whatsappLink}"
                   target="_blank">
                   Buy on WhatsApp
                 </a>`
              : `<a class="buy"
                   href="#"
                   onclick="return false;">
                   WhatsApp Coming Soon
                 </a>`
            }

          </div>

        </div>
      `;
    });
  }

  loadProducts();
</script>

</body>
</html>
